name: Verify Eslam Money 2.2 built APK
on:
  push:
    branches: [codex/eslam-money-2.2.0-verify]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Eslam-Office-Preview-APK
          run-id: 45739323845
          github-token: ${{ github.token }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tool/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-2.2-verification
          path: smoke-output/
