name: eslam_office
description: Eslam Money - offline travel office and accounting.
publish_to: none
version: 1.3.0+2004
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
